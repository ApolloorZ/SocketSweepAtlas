[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = "GPL-3.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# Desktop-only fork: the mobile `cdylib`/`staticlib` targets make the Windows
# GNU linker emit an export table it cannot handle ("export ordinal too large").
name = "tauri_app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Wireless pairing via QR: adb's own mDNS does the discovery, we only render the code.
qrcode = { version = "0.12", default-features = false }
rand = "0.9"

